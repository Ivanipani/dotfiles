[project]
name = "dot"
version = "0.1.0"
description = "Code-first dotfiles engine: plan, diff, reconcile."
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1",
    "rich>=13.7",
    "textual>=1.0",
    "typer>=0.27.2",
]

[project.scripts]
dot = "dot.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.14",
    "basedpyright>=1.31",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# The same split nvim runs over this repo (configs/nvim/.../lsp.lua): ruff
# lints and formats, basedpyright does types. Keeping the config here means
# the editor and `just check` cannot disagree about what is an error.

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".build", ".venv"]

[tool.ruff.lint]
select = [
    "F",      # pyflakes
    "E", "W", # pycodestyle
    "I",      # import sorting
    "UP",     # pyupgrade
    "B",      # bugbear
    "SIM",    # simplify
    "RUF",
]
ignore = [
    "E501",    # the formatter owns line length; the linter nagging about it is noise
    "SIM105",  # contextlib.suppress reads worse than try/except pass in check()
    "RUF001",  # the drift glyphs in theme.py are deliberate, not typos for ASCII
    "UP042",   # Status is `str, Enum` on purpose: it compares and serializes as "ok"
]

[tool.ruff.lint.per-file-ignores]
# Modules are a small declarative DSL: `host` is part of the signature whether
# or not a given plan branches on it, and star-ish imports read as the grammar.
"configs/*/module.py" = ["ARG002"]
# Textual declares BINDINGS as a ClassVar on the base class; restating that
# here would only obscure the widget definition.
"src/dot/tui.py" = ["RUF012"]

[tool.ruff.format]
docstring-code-format = true

[tool.basedpyright]
include = ["src", "tests", "configs"]
exclude = ["**/__pycache__", ".build", ".venv"]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
# basedpyright's own default is "all", which buries real errors under strictness
# opinions this codebase deliberately does not hold (implicit Any on **kwargs,
# unannotated self, etc.). "standard" is pyright parity.
typeCheckingMode = "standard"
reportMissingImports = "error"
reportUnusedImport = "none"  # ruff's F401 already covers this, with autofix
