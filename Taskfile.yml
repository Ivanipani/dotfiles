version: '3'

vars:
  PLUGINS: zellij-sessionizer zellij-workspace
  CLIS: repo-sync
  TARGET: wasm32-wasip1

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - task --list

  build:
    desc: Build every Rust crate in release mode (wasm plugins and native CLIs)
    # No sources/generates: cargo's own incremental cache decides what to rebuild.
    cmds:
      - for: {var: PLUGINS, split: ' '}
        cmd: cargo build --release --target {{.TARGET}} --manifest-path src/{{.ITEM}}/Cargo.toml
      - for: {var: CLIS, split: ' '}
        cmd: cargo build --release --manifest-path src/{{.ITEM}}/Cargo.toml

  deploy:
    desc: Build everything and let dot link the results into place
    cmds:
      - task: build
      - dot apply tools zellij

  test:
    desc: Run every crate's tests
    cmds:
      - for: {var: PLUGINS, split: ' '}
        cmd: cargo test --manifest-path src/{{.ITEM}}/Cargo.toml
      - for: {var: CLIS, split: ' '}
        cmd: cargo test --manifest-path src/{{.ITEM}}/Cargo.toml

  repos:
    desc: Reconcile the repos in src/repo-sync/repos.yaml onto this machine
    cmds:
      - cargo run --release --manifest-path src/repo-sync/Cargo.toml -- src/repo-sync/repos.yaml
