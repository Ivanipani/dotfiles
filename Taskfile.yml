version: '3'

vars:
  PLUGINS: zellij-sessionizer zellij-workspace
  TARGET: wasm32-wasip1

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - task --list

  build:
    desc: Build every cargo plugin (release, wasm)
    cmds:
      - for: {var: PLUGINS, split: ' '}
        task: build-one
        vars: {PLUGIN: '{{.ITEM}}'}

  build-one:
    internal: true
    requires:
      vars: [PLUGIN]
    dir: '{{.ROOT_DIR}}/src/{{.PLUGIN}}'
    # No sources/generates: cargo's own incremental cache decides what to rebuild.
    cmds:
      - cargo build --release --target {{.TARGET}}

  deploy:
    desc: Build the plugins and let dot link them into ~/.config/zellij/plugins
    cmds:
      - task: build
      - dot apply zellij

  test:
    desc: Run the plugin crates' tests
    cmds:
      - for: {var: PLUGINS, split: ' '}
        cmd: cargo test --manifest-path src/{{.ITEM}}/Cargo.toml

  repos:
    desc: Reconcile the repos in src/repo-sync/repos.yaml onto this machine
    cmds:
      - cargo run --release --manifest-path src/repo-sync/Cargo.toml -- src/repo-sync/repos.yaml

  install-repo-sync:
    desc: Build repo-sync and symlink it into ~/.local/bin (via dot)
    cmds:
      - cargo build --release --manifest-path src/repo-sync/Cargo.toml
      - dot apply tools

  test-repos:
    desc: Run the repo-sync tests
    cmds:
      - cargo test --manifest-path src/repo-sync/Cargo.toml
